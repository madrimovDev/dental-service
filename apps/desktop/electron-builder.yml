# electron-builder konfiguratsiyasi (V3-3) — Dental Service desktop.
# ⚠️ Distribution uchun code-signing kerak (TODO, V3-3 jonli):
#   - mac: Developer ID sertifikat; win: code-signing sertifikat.
# Auto-update publish provider — quyida `publish:` (CLI-357, Task 12).
appId: uz.dental.service
productName: Dental Service
# Native-modul rebuild o'chirilgan (CLI-361 real Windows build'da topildi).
# Sabab: electron-builder paket-menejerni `npm_execpath`dan aniqlab uni
# `node <execpath>` ko'rinishida chaqiradi — bun monorepo'da bu ikki xil
# yo'l bilan qulaydi: npm bilan `workspace:*` protokoli tushunilmaydi
# ("EUNSUPPORTEDPROTOCOL"), bun bilan esa `bun.exe` JS fayl sifatida
# parse qilinadi ("Invalid or unexpected token").
# Xavfsiz: apps/desktop bog'liqliklari (@homebridge/ciao, electron-updater)
# sof JS — kompilyatsiya qilinadigan native addon yo'q. Kelajakda native
# modul qo'shilsa bu qayta ko'rib chiqilishi SHART.
npmRebuild: false
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
extraResources:
  - from: resources/postgres
    to: postgres
    filter: ["**/*"]
  - from: resources/valkey
    to: valkey
    filter: ["**/*"]
  - from: ../../dist/api.exe    # bun compile chiqishi
    to: api.exe
  # Bitta-EXE arxitektura — api.exe apps/web build outputni ham serve qiladi
  # (apps/api/src/app.ts, WEB_DIST_DIR). `bun run build` oldidan
  # `cd apps/web && bun run build` bajarilishi shart.
  - from: ../web/dist
    to: web
    filter: ["**/*"]
  # `bun build --compile` migratsiya SQL fayllarini (meta/_journal.json + RLS
  # DDL) ICHIGA OLMAYDI — first-run.ts `runMigrations()` bularni api.exe
  # yoniga (sibling) resurs sifatida kutadi (2026-07-02 real-run'da topildi;
  # MIGRATIONS_DIR/RLS_MIGRATIONS_DIR — apps/api/src/db/migrate.ts).
  - from: ../api/drizzle
    to: drizzle
    filter: ["**/*"]
  - from: ../api/migrations/rls
    to: migrations/rls
    filter: ["**/*"]
  - from: ../../infra/postgres-win.conf
    to: ../infra/postgres-win.conf
  - from: ../../infra/valkey-win.conf
    to: ../infra/valkey-win.conf
mac:
  target: dmg
  category: public.app-category.medical
win:
  target: nsis
  # PLACEHOLDER (CLI-367) — build/icon.ico haqiqiy brend logotipi emas, almashtirilishi kerak (CLI-361 real build oldidan)
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerLanguages: [uz, ru]
  # NSIS'ning o'zbek tarjima faylida `MULTIUSER_TEXT_INSTALLMODE_TITLE` yo'q —
  # ingliz fallback'i ishlatiladi va bu ogohlantirish default'da xatoga
  # aylantirilib build'ni to'xtatardi (CLI-361 real Windows build'da topildi).
  # Faqat shu kosmetik fallback uchun `uz` tilini tashlab yubormaymiz.
  warningsAsErrors: false
  include: build/installer.nsh    # rol tanlash dialog
linux:
  target: AppImage
  category: Office
# Auto-update (CLI-357) — o'z (generic) update serveri, `UPDATE_URL` build-time
# environment o'zgaruvchisidan olinadi:
#   UPDATE_URL=https://updates.dental-service.uz bun run build
# Serverda `latest.yml` + installer EXE static serve qilinishi kerak.
publish:
  provider: generic
  url: "${env.UPDATE_URL}"
