name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dental
          POSTGRES_PASSWORD: dental
          POSTGRES_DB: dental
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dental"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://dental:dental@localhost:5432/dental
      REDIS_URL: redis://localhost:6379
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_BUCKET: dental-test
      MINIO_ROOT_USER: dental
      MINIO_ROOT_PASSWORD: dental_local_dev
      JWT_SECRET: ci_test_secret_min_32_chars_long_xxx_yyy
      WEB_ORIGIN: http://localhost:8000
      API_PORT: 8001
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: RLS coverage check
        run: bun run check:rls

      - name: Apply migrations (Drizzle + RLS DDL)
        run: bun run db:migrate

      - name: Test
        run: bun run test
