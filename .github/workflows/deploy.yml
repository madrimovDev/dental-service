name: Deploy

# Builds + pushes the api and web images to GHCR, then runs the release-time DB
# migration. Gated on push to `main` (after CI passes) and manual dispatch.
#
# Required repository secrets / vars (Settings -> Secrets and variables):
#   secrets.DATABASE_ADMIN_URL  — admin/superuser Postgres URL for migrations
#                                 (reachable from the GitHub runner, or run the
#                                  migrate job on a self-hosted runner in-VPC)
#   secrets.JWT_SECRET          — only needed if a deploy step boots the app
# GITHUB_TOKEN (auto) is used to push to GHCR; no extra secret required.
#
# The image registry is ghcr.io/<owner>/<repo>-{api,web}.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository }}-api
  IMAGE_WEB: ghcr.io/${{ github.repository }}-web

jobs:
  # ---- 1. Build + push both images ----------------------------------------
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build context is the repo ROOT (workspace install needs the root lockfile).
      - name: Build + push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build + push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          # VITE_API_BASE_URL empty -> SPA uses relative /api via the edge host.
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ---- 2. Release migration (gated AFTER images, BEFORE app rollout) -------
  # Applies Drizzle SQL migrations + RLS DDL with the admin connection. Runs the
  # api image just-built so the migration code matches the deployed version.
  migrate:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Use a GitHub Environment to require approval + scope the DB secret.
    environment: production
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run DB migrations (Drizzle + RLS DDL)
        run: |
          docker run --rm \
            -e NODE_ENV=production \
            -e DATABASE_URL="${{ secrets.DATABASE_ADMIN_URL }}" \
            -e DATABASE_ADMIN_URL="${{ secrets.DATABASE_ADMIN_URL }}" \
            -e LOG_LEVEL=info \
            "${{ env.IMAGE_API }}:${{ github.sha }}" \
            bun run src/db/migrate.ts

  # ---- 3. Rollout placeholder ---------------------------------------------
  # Wire this to your host: SSH + `docker compose ... up -d`, or `kubectl set
  # image`, or a deploy provider. Gated AFTER migrate so schema is ready first.
  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Roll out new images
        run: |
          echo "Pull ${{ env.IMAGE_API }}:${{ github.sha }} + ${{ env.IMAGE_WEB }}:${{ github.sha }}"
          echo "Then: docker compose -f infra/docker-compose.prod.yml up -d (api worker web caddy)"
          echo "See docs/runbooks/deployment.md. Replace this step with your host's rollout command."
