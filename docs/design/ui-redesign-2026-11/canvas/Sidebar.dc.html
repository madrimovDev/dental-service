<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Menyu komponenti</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Asosiy menyu" style="width: 248px; min-height: 980px; height: 100%; box-sizing: border-box; background: #fafbf8; border-right: 1px solid #e4e8e1; padding: 20px 14px; display: flex; flex-direction: column; gap: 20px; font-family: 'Hanken Grotesk', system-ui, sans-serif; color: #192420; font-size: 15px">
  <button type="button" style="display: flex; align-items: center; gap: 10px; padding: 6px; border: 0; background: transparent; border-radius: 10px; text-align: left; font: inherit; color: inherit; cursor: pointer">
    <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 9px; background: #0b7a6b; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; flex: none">S</span>
    <span style="display: flex; flex-direction: column; min-width: 0"><b style="font-size: 15px">Smile Dent</b><span style="font-size: 13px; color: #4c5852">{{branch}} ▾</span></span>
  </button>

  <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #5f6b65; padding: 0 10px 6px">{{g.title}}</span>
      <sc-for list="{{g.items}}" as="i" hint-placeholder-count="3">
        <a href="{{i.href}}" style="{{i.style}}">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{i.d}}"></path></svg>
          <span style="flex: 1">{{i.label}}</span>
          <sc-if value="{{i.hasBadge}}" hint-placeholder-val="{{ false }}"><span style="{{i.badgeStyle}}">{{i.badge}}</span></sc-if>
        </a>
      </sc-for>
    </div>
  </sc-for>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <div role="status" style="{{conn.box}}">
      <span aria-hidden="true" style="{{conn.dot}}"></span>
      <span style="display: flex; flex-direction: column"><b style="font-size: 13px">{{conn.title}}</b><span style="font-size: 12px">{{conn.text}}</span></span>
    </div>
    <sc-if value="{{showSettings}}" hint-placeholder-val="{{ true }}">
      <a href="Settings.dc.html" style="{{settingsStyle}}">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>Sozlamalar</a>
    </sc-if>
    <div style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-top: 1px solid #e4e8e1">
      <span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 99px; background: #e7f6f1; color: #096154; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex: none">{{user.initials}}</span>
      <span style="display: flex; flex-direction: column; margin-right: auto"><b style="font-size: 14px">{{user.name}}</b><span style="font-size: 13px; color: #4c5852">{{user.role}}</span></span>
      <button type="button" aria-label="Chiqish" style="width: 40px; height: 40px; border-radius: 8px; border: 0; background: transparent; color: #4c5852; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg></button>
    </div>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","options":["registrator","shifokor","rahbar","texnik"],"default":"registrator"},"active":{"editor":"text","default":"bugun"},"conn":{"editor":"enum","options":["lan","offline","cloud","noserver"],"default":"lan"},"$preview":{"width":248,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    var role = this.props.role || 'registrator';
    var active = this.props.active || 'bugun';
    var conn = this.props.conn || 'lan';
    var D = {
      home: 'M3 10.5 12 3l9 7.5V21H3z',
      cal: 'M3 5h18v16H3zM3 10h18M8 3v4M16 3v4',
      queue: 'M4 6h16M4 12h16M4 18h10',
      users: 'M9 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21c0-4 3-6 7-6s7 2 7 6M17 11a3 3 0 1 0 0-6M22 21c0-3-2-5-5-5.5',
      cash: 'M2 6h20v13H2zM2 10h20M6 15h4',
      recall: 'M21 12a9 9 0 1 1-3-6.7M21 3v6h-6',
      plan: 'M9 5h11M9 12h11M9 19h11M4 5h.01M4 12h.01M4 19h.01',
      lab: 'M9 3h6M10 3v6L4 19a2 2 0 0 0 1.7 3h12.6a2 2 0 0 0 1.7-3L14 9V3',
      chart: 'M4 20V10M10 20V4M16 20v-7M22 20H2',
      box: 'M21 8 12 3 3 8v8l9 5 9-5zM3 8l9 5 9-5M12 13v8',
      money: 'M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6',
      pay: 'M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0zM4 21v-1a6 6 0 0 1 6-6h4'
    };
    var M = {
      registrator: [
        { title: 'Bugungi ish', items: [['bugun', 'Bugun', 'home', 'Main.dc.html'], ['kalendar', 'Kalendar', 'cal', 'Calendar.dc.html'], ['navbat', 'Navbat', 'queue', 'Queue.dc.html', '4', 'warn']] },
        { title: 'Bemorlar va pul', items: [['bemorlar', 'Bemorlar', 'users', 'Patients.dc.html'], ['kassa', 'Kassa', 'cash', 'Cashier.dc.html'], ['recall', 'Qayta chaqiruv', 'recall', '#', '7', 'neutral']] }
      ],
      shifokor: [
        { title: 'Bugungi ish', items: [['kun', 'Mening kunim', 'home', 'DoctorDay.dc.html'], ['navbat', 'Navbat', 'queue', 'Queue.dc.html', '2', 'warn']] },
        { title: 'Davolash', items: [['bemorlar', 'Bemorlar', 'users', 'Patient.dc.html'], ['rejalar', 'Davolash rejalari', 'plan', 'Odontogram.dc.html'], ['lab', 'Laboratoriya', 'lab', 'LabOrder.dc.html', '1', 'warn']] }
      ],
      rahbar: [
        { title: 'Umumiy', items: [['bugun', 'Bugun', 'home', 'OwnerDashboard.dc.html'], ['kalendar', 'Kalendar', 'cal', 'Calendar.dc.html'], ['bemorlar', 'Bemorlar', 'users', 'Patients.dc.html'], ['kassa', 'Kassa', 'cash', 'Cashier.dc.html']] },
        { title: 'Boshqaruv', items: [['hisobot', 'Hisobotlar', 'chart', 'Reports.dc.html'], ['ombor', 'Ombor', 'box', 'Stock.dc.html', '3', 'warn'], ['xodimlar', 'Xodimlar', 'users', 'Staff.dc.html'], ['moliya', 'Xarajat va ish haqi', 'money', 'Finance.dc.html']] }
      ],
      texnik: [
        { title: 'Laboratoriya', items: [['lab', 'Buyurtmalar', 'lab', 'LabPortal.dc.html', '5', 'warn'], ['klinikalar', 'Klinikalar', 'users', '#'], ['hisob', 'Hisob-kitob', 'money', '#']] }
      ]
    };
    var base = 'display:flex;align-items:center;gap:10px;min-height:44px;padding:0 10px;border-radius:8px;text-decoration:none;';
    var badges = {
      warn: 'font-size:13px;font-weight:700;background:#fbf1dd;color:#7a4f0a;border-radius:99px;padding:1px 8px;',
      neutral: 'font-size:13px;font-weight:700;background:#edf0ea;color:#33403a;border-radius:99px;padding:1px 8px;'
    };
    var groups = (M[role] || M.registrator).map(function (g) {
      return { title: g.title, items: g.items.map(function (x) {
        var on = x[0] === active;
        return { label: x[1], d: D[x[2]], href: x[3], hasBadge: !!x[4], badge: x[4] || '', badgeStyle: badges[x[5] || 'neutral'],
          style: base + (on ? 'background:#ddefea;color:#096154;font-weight:700;' : 'color:#192420;') };
      }) };
    });
    var C = {
      lan: { title: 'Server ulangan', text: 'Lokal tarmoq · internetsiz ishlaydi', bg: '#e7f6f1', fg: '#0a4e45', dot: '#0b7a6b' },
      offline: { title: 'Internet yo‘q', text: 'Ish davom etmoqda · SMS/Telegram navbatda', bg: '#fbf1dd', fg: '#7a4f0a', dot: '#b57611' },
      cloud: { title: 'Bulut', text: 'Oxirgi sinxron: hozir', bg: '#e8eefb', fg: '#1f4f9e', dot: '#2a66cc' },
      noserver: { title: 'Server topilmadi', text: 'Qayta qidirilmoqda · 30 s', bg: '#fbe7e5', fg: '#842523', dot: '#cc3d3a' }
    };
    var c = C[conn] || C.lan;
    var U = {
      registrator: { name: 'Malika Azimova', role: 'Registrator', initials: 'MA' },
      shifokor: { name: 'Dr. Laylo Yusupova', role: 'Ortoped', initials: 'LY' },
      rahbar: { name: 'Anvar Karimov', role: 'Klinika egasi', initials: 'AK' },
      texnik: { name: 'Shoxrux Olimov', role: 'Texnik · Oq Tish', initials: 'SO' }
    };
    return {
      groups: groups,
      branch: role === 'texnik' ? 'Oq Tish laboratoriyasi' : 'Chilonzor filiali',
      showSettings: role === 'rahbar',
      settingsStyle: base + (active === 'sozlamalar' ? 'background:#ddefea;color:#096154;font-weight:700;' : 'color:#192420;'),
      user: U[role] || U.registrator,
      conn: {
        title: c.title, text: c.text,
        box: 'display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:10px;background:' + c.bg + ';color:' + c.fg + ';',
        dot: 'width:9px;height:9px;border-radius:99px;margin-top:5px;flex:none;background:' + c.dot + ';'
      }
    };
  }
}
</script>
</body>
</html>
