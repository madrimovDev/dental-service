# Production orchestration for the Supervisor licensing/admin backend.
#
# ⚠️ SINGLE CENTRAL DEPLOYMENT — this is the VENDOR's OWN VPS, not a
# per-clinic deploy. It is intentionally namespaced under infra/supervisor/
# so it is NEVER bundled into a clinic's dental-service deploy (see the root
# infra/docker-compose.prod.yml for that — separate stack, separate secrets,
# no shared service names, no shared network).
#
# Usage (run from infra/supervisor/):
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#   docker compose -f docker-compose.prod.yml run --rm migrate   # release step (also seeds admin)
#
# Build context for api/admin images is the repo ROOT (bun workspace install
# needs the full monorepo lockfile) — see apps/supervisor-api/Dockerfile and
# apps/supervisor-admin/Dockerfile for why every workspace manifest is copied.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: supervisor
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  # Release-time migration (run once per deploy, then exits). Also seeds the
  # bootstrap admin user (apps/supervisor-api/src/db/seed.ts, idempotent).
  migrate:
    image: ${SUPERVISOR_API_IMAGE:-supervisor-api:latest}
    build:
      context: ../..
      dockerfile: apps/supervisor-api/Dockerfile
    command: ['bun', 'run', 'src/db/migrate.ts']
    restart: 'no'
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:?set ADMIN_SEED_EMAIL}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:?set ADMIN_SEED_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  api:
    image: ${SUPERVISOR_API_IMAGE:-supervisor-api:latest}
    build:
      context: ../..
      dockerfile: apps/supervisor-api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      RSA_PRIVATE_KEY: ${RSA_PRIVATE_KEY:?set RSA_PRIVATE_KEY}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      API_PORT: 3101
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  admin:
    image: ${SUPERVISOR_ADMIN_IMAGE:-supervisor-admin:latest}
    build:
      context: ../..
      dockerfile: apps/supervisor-admin/Dockerfile
    restart: unless-stopped
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    depends_on: [api, admin]
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
