# Production orchestration for dental-service (CLI-233 / D2).
#
# Differences from infra/docker-compose.yml (dev):
#   - Adds the application services: api, worker, web, caddy (edge TLS).
#   - NO `*_local_dev` fallback passwords — every secret is `${VAR}` with NO
#     default, so a missing secret fails fast instead of booting insecurely.
#     Inject via an env file or a secret manager (see docs/runbooks/deployment.md).
#   - Datastore ports are NOT published to the host (internal network only).
#
# Usage:
#   docker compose -f infra/docker-compose.prod.yml --env-file .env.production up -d
#   docker compose -f infra/docker-compose.prod.yml run --rm migrate   # release step
#
# Build context for api/web images is the repo ROOT (workspace install needs it).

services:
  # ---- datastores ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  # Creates the bucket. Bucket stays PRIVATE — patient images are PII served
  # only via short-lived presigned URLs. Do NOT add `mc anonymous set`.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${MINIO_BUCKET};
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    networks: [internal]

  # ---- release-time migration (run once per deploy, then exits) ------------
  # `docker compose ... run --rm migrate` applies Drizzle + RLS DDL using the
  # ADMIN (superuser) connection. Not a long-running service.
  migrate:
    image: ${API_IMAGE:-dental-api:latest}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: 'no'
    command: ['bun', 'run', 'src/db/migrate.ts']
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:?set DATABASE_ADMIN_URL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  # ---- application: API server --------------------------------------------
  api:
    image: ${API_IMAGE:-dental-api:latest}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 8001
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:-}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?set MINIO_ENDPOINT}
      MINIO_BUCKET: ${MINIO_BUCKET:?set MINIO_BUCKET}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-7d}
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ESKIZ_EMAIL: ${ESKIZ_EMAIL:-}
      ESKIZ_PASSWORD: ${ESKIZ_PASSWORD:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # API does NOT run the in-process reminder worker — the `worker` service does.
      RUN_REMINDER_WORKER: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  # ---- application: BullMQ worker (separate process) ----------------------
  worker:
    image: ${API_IMAGE:-dental-api:latest}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ['bun', 'run', 'src/worker.ts']
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?set MINIO_ENDPOINT}
      MINIO_BUCKET: ${MINIO_BUCKET:?set MINIO_BUCKET}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ESKIZ_EMAIL: ${ESKIZ_EMAIL:-}
      ESKIZ_PASSWORD: ${ESKIZ_PASSWORD:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  # ---- application: web SPA (static, served internally) -------------------
  web:
    image: ${WEB_IMAGE:-dental-web:latest}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # Empty base = relative `/api` (same origin via edge Caddy) — no CORS.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    networks: [internal]

  # ---- edge: Caddy reverse proxy + automatic TLS --------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
