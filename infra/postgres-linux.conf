# infra/postgres-linux.conf — Linux/macOS office PC (i3/i5, 8GB RAM, ~5 ta
# klient) uchun. postgres-win.conf bilan bir xil resurs profili, faqat
# posix_fadvise() Linux'da mavjud bo'lgani uchun effective_io_concurrency
# yoqilgan (Windows'da bu FATAL xato beradi — shu sabab alohida fayl).
# Port 5433 (standart 5432 emas — boshqa PG instansiyalari bilan konflikt oldini olish)
port = 5433
shared_buffers = 64MB
work_mem = 4MB
maintenance_work_mem = 32MB
max_connections = 20
effective_cache_size = 256MB
wal_buffers = 4MB
checkpoint_completion_target = 0.9
random_page_cost = 1.1
# Fedora/RHEL'ning rasmiy postgresql-server paketi build-time default'i
# `/var/run/postgresql` (root-egalik tizim papkasi) — oddiy foydalanuvchi
# sifatida ishga tushirilganda "Permission denied" bilan qulaydi (2026-07-02
# topildi). TCP orqali ulanamiz (localhost:5433), Unix socket kerak emas —
# butunlay o'chirib qo'yamiz, distributsiyaga bog'liq bo'lmaydi.
unix_socket_directories = ''
effective_io_concurrency = 200
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
