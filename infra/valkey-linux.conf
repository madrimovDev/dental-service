# infra/valkey-linux.conf — valkey-win.conf bilan bir xil, Linux/macOS uchun
# (Valkey konfiguratsiyasi platform-neutral, alohida faylga ehtiyoj yo'q edi,
# lekin postgres-linux.conf bilan bir xil naqsh saqlash uchun ajratilgan).
# Port 6380 (standart 6379 emas — boshqa Redis/Valkey instansiyalari bilan konflikt oldini olish)
port 6380
maxmemory 64mb
# CLI-403: BullMQ `noeviction` talab qiladi — `allkeys-lru` bilan queue kalitlari
# (reminder/recall job'lari) xotira to'lganda jim evict bo'lib, job'lar ko'rinmasdan
# yo'qolardi. `noeviction` bilan xotira to'lsa yangi yozish ko'rinadigan xato beradi
# (jim data-loss o'rniga fail-loud). BullMQ har ulanishda buni tekshiradi/ogohlantiradi.
maxmemory-policy noeviction
appendonly no
save ""
loglevel warning
